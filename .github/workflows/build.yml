name: Build and release
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (v<date>-android)
        type: boolean
        default: true
      tag:
        description: Release tag (empty = v<date>-android). For a second build on the same day.
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm ninja-build pkg-config zip unzip python3-jinja2
          pipx install meson==1.9.2
          meson --version; cmake --version | head -1

      - name: Build
        run: |
          T="${{ inputs.tag }}"; [ -n "$T" ] || T=v$(date -u +%Y.%m.%d)-android
          echo "TAG=$T" >> "$GITHUB_ENV"
          TAG=$T ./build-android.sh

      - name: Upload the build (always kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: bleo-video-engine-android
          path: |
            out-android/*.zip
            out-android/SHA256SUMS.txt
            out-android/CONFIGURE.txt
            out-android/BUILDINFO.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: |
            work-android/step.log
            work-android/*/b-*/meson-logs/meson-log.txt
            work-android/*/b-ffmpeg/ffbuild/config.log
            work-android/*/b-soxr/CMakeFiles/*.log

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out-android
          # Bleo pins each release's SHA-256, so a published release is never replaced.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG exists already"; exit 1; fi
          {
            echo "Bleo's video engine for Android: libmpv.so (mpv + FFmpeg) for arm64-v8a, armeabi-v7a and x86_64, Android 8+ (API 26)."
            echo
            echo "**Files**"
            echo "- \`bleo-video-engine-$TAG.zip\`: \`lib/<abi>/libmpv.so\` (the APK and jniLibs layout), headers, LICENSES/, BUILDINFO.txt, CONFIGURE.txt"
            echo "- \`bleo-video-engine-$TAG-source.tar\`: the corresponding source (every exact source tarball, the build scripts, licences)"
            echo "- \`SHA256SUMS.txt\`, \`CONFIGURE.txt\` (the exact configure lines), \`BUILDINFO.txt\` (versions)"
            echo
            echo '```'; cat SHA256SUMS.txt; echo '```'
            echo '```'; cat BUILDINFO.txt; echo '```'
          } > notes.md
          gh release create "$TAG" --title "Bleo video engine $TAG" --notes-file notes.md \
            bleo-video-engine-*.zip bleo-video-engine-*-source.tar SHA256SUMS.txt CONFIGURE.txt BUILDINFO.txt
